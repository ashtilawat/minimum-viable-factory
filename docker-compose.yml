services:
  factory:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./memory:/app/memory
      - ./.claude:/app/.claude
      - ./audit:/app/audit
      - ./workspace:/app/workspace
      - ${HOME}/.codex:/home/factory/.codex
      - ${HOME}/.cursor:/home/factory/.cursor
    environment:
      CODEX_HOME: /home/factory/.codex
    env_file:
      - .env
