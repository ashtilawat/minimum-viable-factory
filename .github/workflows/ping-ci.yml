name: PING CI

on:
  push:
    paths:
      - "ping/**"
      - ".github/workflows/ping-ci.yml"
  pull_request:
    paths:
      - "ping/**"
      - ".github/workflows/ping-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ping
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ping/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
